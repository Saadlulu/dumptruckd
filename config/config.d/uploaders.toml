# Uploader Component Definitions
# Define reusable upload destination configurations here

# Production S3 bucket
[uploader.prod_s3]
type = "s3"
  [uploader.prod_s3.s3]
  bucket = "my-backup-bucket-prod"
  region = "us-east-1"
  prefix = "db"
  # Credentials from environment: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

# Staging S3 bucket
[uploader.staging_s3]
type = "s3"
  [uploader.staging_s3.s3]
  bucket = "my-backup-bucket-staging"
  region = "us-east-1"
  prefix = "db/staging"
  # Credentials from environment: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

# Local filesystem uploader
[uploader.local_backups]
type = "local"
path = "/var/backups/dumptruckd"

